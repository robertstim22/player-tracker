name: Refresh stats
on:
  schedule:
    # Every 30 min Thu-Sat (UTC), plus Sunday 00:00-06:30 UTC so late
    # Saturday-night games (ET/PT) are still picked up.
    - cron: "*/30 * * * 4-6"
    - cron: "*/30 0-6 * * 0"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node scripts/fetch.mjs
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
      - name: Commit if changed
        run: |
          git config user.name "stats-bot"
          git config user.email "stats-bot@users.noreply.github.com"
          git add data/stats.json data/cache.json
          git diff --staged --quiet || (git commit -m "Update stats" && git push)
